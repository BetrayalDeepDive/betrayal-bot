# ============================================================
# NO KNOWN CAUSE — Ch1 Generation Workflow
# Phase 1: GENERATE only (no upload)
# Runs: Mon-Fri 8:30 PM IST = 15:00 UTC
# Stores video + script + thumbnail via pending_upload.json in repo
# Features: 13-attempt engine, SSML multi-rate audio, stage-matched
#           video, 3-variant cold open, provider health check,
#           pattern memory, A/B thumbnails, 4 Shorts/day (2 on-topic +
#           2 real-trend-researched, teaser/recap removed per explicit request)
# ============================================================
name: Ch1 No Known Cause — Generate

on:
  # ── THE TIMETABLE ────────────────────────────────────────────────
  # Feeds the Wed/Fri/Sun upload at 19:00 UTC (00:30 IST).
  #
  # STILL PAUSED, DELIBERATELY. These are the final values, ready to
  # go; uncommenting the two lines below turns this channel on. They
  # are not enabled yet because no channel has completed a clean run
  # since the capacity fixes landed, and scheduling five channels
  # against a pipeline that has not finished once would just multiply
  # the failure by five. Turn Ch1 on first, once its test passes.
  # schedule:
  #   - cron: '30 3 * * 2,4,6'   # 09:00 IST | Tue, Thu, Sat — slot A
  workflow_dispatch:
    inputs:
      is_makeup:
        # FIX (direct user request, July 25 2026 — real resume-from-last-
        # passed-stage): this input already existed and was already wired
        # to IS_MAKEUP below, but clinical_pipeline.py never actually read
        # a checkpoint back -- ckpt_save/ckpt_load were defined and never
        # called. Now genuinely real: set to 'true' after a cancelled/
        # failed run and the next run skips whichever of script+title /
        # audio already cleared their gate on the previous attempt,
        # picking up from the next stage instead of starting over.
        description: 'true = resume from last passed stage (script/title/audio), skip what already passed'
        required: false
        default: 'false'
        type: choice
        options: ['false','true']
      probe_only:
        # Not a pipeline feature — a diagnostic hatch. GitHub only registers
        # workflow_dispatch workflows that exist on the DEFAULT branch, so a
        # new probe workflow living on a feature branch cannot be dispatched
        # at all (the API 404s). Rather than push a workflow to main to run a
        # one-off check, the probe rides in here: true runs ONLY the AI-label
        # probe and skips generation entirely; false (the default, and what
        # every scheduled/normal run uses) behaves exactly as before.
        description: 'probe/report/clear = AI-label probe, read-only list, untick the box everywhere. drafts/drafts_apply = list or delete stranded review previews. cleanup = delete leftover probes. false = normal run.'
        required: false
        default: 'false'
        type: choice
        options: ['false','probe','figures','providers','localmodel','report','clear','drafts','drafts_apply','cleanup','true']

env:
  PYTHONUNBUFFERED: "1"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  PHASE: "generate"

# FIX (found on deep re-audit): no concurrency guard existed on any
# of the 10 workflows -- a manual workflow_dispatch/is_makeup re-run
# while a previous run for this same channel+phase is still polling
# Telegram for a review decision could run two full pipeline
# processes in parallel: duplicate script generation burning real AI
# provider quota, two review conversations landing in the same
# Telegram chat at once, and a git-push race where whichever process
# finishes last silently overwrites the other's pending_upload.json.
# cancel-in-progress: false queues the new run instead of killing a
# live review in progress.
# RULE 2: ONE CHANNEL PRODUCES AT A TIME, ACROSS ALL FIVE.
#
# The group used to be per-channel ("ch1-generate"), which prevented a channel
# from colliding with ITSELF but did nothing about two different channels
# generating at the same moment. That is the collision that actually matters:
# two runs asking the same providers in the same minute trip the per-minute
# limits, and the result looks exactly like an outage on both.
#
# With three channels producing on a busy day, a shared group is what makes
# the capacity arithmetic true. cancel-in-progress: false queues the second
# run rather than killing a live review in progress.
concurrency:
  group: episode-generation
  cancel-in-progress: false

jobs:
  # WHICH URL ACTUALLY SERVES A PMC FIGURE?
  #
  # Run 31740721781 lost all nine of its paper's figures — every candidate
  # URL returned HTML or 403 — and shipped a 22-minute episode with 8-10
  # visuals cycling. The pattern in pmc_data has carried a comment since it
  # was written saying it could not be verified from a sandbox, and it still
  # cannot: the dev environment's proxy blocks both ncbi.nlm.nih.gov and
  # www.ebi.ac.uk. Only a runner can answer this, so a runner is asked.
  # Read-only, ~2 minutes, touches no episode state.
  figure_probe:
    if: inputs.probe_only == 'figures'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow -q
      - name: Probe PMC figure routes
        run: python tools/probe_figure_routes.py

  # THE PROVIDER AUDIT, REACHABLE BEFORE THE WEEKLY WORKFLOW IS ON MAIN.
  #
  # provider_audit.yml carries the real Sunday schedule, but GitHub only
  # registers schedule/workflow_dispatch for workflows that exist on the
  # DEFAULT branch — so until that file is merged to main it cannot be
  # triggered at all, and its cron never fires. Same reason the figures probe
  # rides in here. This hatch runs the identical script on demand so the
  # provider chain can be checked today rather than after a merge.
  # IS A MODEL ON THE RUNNER ITSELF FAST ENOUGH TO BE USEFUL?
  #
  # The repository is public, so these machines are free and unmetered. A small
  # model running here would have no key, no quota and nothing anyone can
  # decommission -- immune to every failure mode this project has hit. Whether
  # it is fast enough is an open question, and it can only be answered on the
  # real hardware: the dev sandbox blocks huggingface.co by policy, so the
  # model cannot even be downloaded there.
  #
  # Read-only, ~5 minutes, touches no episode state and no provider quota.
  localmodel_probe:
    if: inputs.probe_only == 'localmodel'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Benchmark a model running on this runner
        run: |
          python tools/bench_local_model.py && \
            echo "::notice::Local model is fast enough — set LOCAL_MODEL_ENABLED=true to use it" || \
            echo "::notice::Local model is too slow on this hardware — leaving it disabled (this is a real answer, not a failure)"
      - name: Keep the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-model-verdict
          path: video_pipeline/local_model_verdict.json
          if-no-files-found: ignore

  provider_probe:
    if: inputs.probe_only == 'providers'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests -q
      - name: Audit every LLM provider
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: 1
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          KILOCODE_API_KEY: ${{ secrets.KILOCODE_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/provider_audit.py
      - name: Commit the health file
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add video_pipeline/provider_health.json || true
          git diff --staged --quiet || \
            git commit -m "chore: provider health [skip ci]"
          for i in 1 2 3; do
            git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((i*5))
            # --autostash: the retry could never work without it. The pull ran
          # with the pipeline's own uncommitted output still in the tree, so
          # git refused ("cannot pull with rebase: You have unstaged
          # changes") on all five attempts and the commit never reached
          # GitHub -- the exact failure this retry loop exists to prevent.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          done

  # Diagnostic only — see probe_only above. Uploads one ~6s PRIVATE clip
  # declaring containsSyntheticMedia=false and reads the stored status back,
  # to find out whether YouTube applies the "Made with AI" label from its own
  # detection regardless of what we declare. Never runs unless asked for.
  label_probe:
    # 'figures' has its own job above; without excluding it here the AI-label
    # probe would also fire and upload a clip nobody asked for.
    if: inputs.probe_only != 'false' && inputs.probe_only != '' && inputs.probe_only != 'figures' && inputs.probe_only != 'providers'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests -q
      # The runner image no longer ships ffmpeg (the generate job below
      # installs it too) — without this the probe dies before it uploads
      # anything, which looks like a probe failure but is just a missing
      # binary.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core -qq
      - name: Upload probe and read the label back
        if: inputs.probe_only == 'probe' || inputs.probe_only == 'true'
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python tools/ai_label_probe.py --keep
      # Read-only: lists which already-published videos still declare
      # synthetic media. Changes nothing — clearing them is a separate,
      # deliberate call.
      - name: Report which published videos still carry the label
        if: inputs.probe_only == 'report'
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python tools/clear_synthetic_label.py
      # Edits live published videos: unticks the AI-use box on each one.
      # Reversible (Studio can tick it back), and explicitly asked for.
      - name: Clear the AI label from every published video
        if: inputs.probe_only == 'clear'
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python tools/clear_synthetic_label.py --apply
      # Read-only unless drafts_apply. Removes review previews stranded by
      # generate runs that were never followed by an upload run — the leak
      # itself is fixed in save_pending, this is for the ones already there.
      - name: Report stranded review previews
        if: inputs.probe_only == 'drafts' || inputs.probe_only == 'drafts_apply'
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.probe_only }}" = "drafts_apply" ]; then
            python tools/clean_draft_previews.py --apply
          else
            python tools/clean_draft_previews.py
          fi
      - name: Delete leftover probe videos
        if: inputs.probe_only == 'clear' || inputs.probe_only == 'cleanup'
        env:
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python tools/ai_label_probe.py --cleanup

  generate:
    if: inputs.probe_only == 'false' || inputs.probe_only == ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      # FIX (direct user report, July 24 2026 — "look for other providers
      # which are free and can be used"): grants the job's own GITHUB_TOKEN
      # read access to GitHub Models (models.github.ai) — a genuinely free,
      # OpenAI-compatible inference API that needs no new secret at all.
      models: read

    steps:
      # FIX (found live this session, a real crash on run 30273984049):
      # actions/checkout@v4 defaults to fetch-depth 1 (a single commit,
      # no history). "Pull latest state" below then does a cross-ref
      # `git pull --rebase origin main` -- with no shared history in the
      # shallow clone, git can't compute a real merge base, so it treats
      # every file that differs from main as an "add/add" conflict, even
      # when the two sides touched completely disjoint files/lines. The
      # conflict markers get left in the working tree, and the very next
      # step executes clinical_pipeline.py containing literal
      # "<<<<<<< HEAD" text, producing a nonsense SyntaxError with no
      # relation to the actual code change. fetch-depth: 0 (full history)
      # lets git compute the real merge base so genuinely non-conflicting
      # changes on a feature branch vs. main merge cleanly, same fix
      # applied to all 14 workflows in this repo.
      # Anchor the job clock BEFORE anything else runs. Run 30688297894 was
      # cancelled at 5h58m mid-reassembly and lost every artifact it had
      # built, because no loop in the pipeline knew how much of the 6-hour
      # limit was left. It does now -- but only if it knows when the job
      # actually started. Python module import time is not that: the review
      # gate is first imported roughly an hour in, which would make the
      # pipeline believe it has an hour more than it does. JOB_LIMIT_MINUTES
      # is exported alongside it so it cannot drift from timeout-minutes
      # above without both being edited together.
      #
      # JOB_MIN_GATE_MIN is the review floor: the shortest window in which a
      # person can actually watch the artifact, judge it and press a button.
      # It is exported here, next to the job limit, because the two are one
      # budget: generation is allowed to run until
      #   remaining > JOB_RESERVE_MIN + (gates left x JOB_MIN_GATE_MIN)
      # and everything after that point belongs to the reviewer. Raising it
      # buys longer windows and stops generation sooner; lowering it does the
      # reverse. Stated here so changing the policy is one visible edit rather
      # than a constant buried in a module.
      - name: Anchor the job clock
        run: |
          echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "JOB_LIMIT_MINUTES=360" >> "$GITHUB_ENV"
          echo "JOB_MIN_GATE_MIN=12" >> "$GITHUB_ENV"
          echo "JOB_GATES_PER_EPISODE=6" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          # espeak-ng stays, and it is NOT a voice. Kokoro — the primary
          # human narration route — phonemizes through it. No code calls it
          # as a synthesiser any more (see video_pipeline/voice_policy.py);
          # removing the package here would break Kokoro, not enforce the
          # policy. The policy is enforced in the code, where it belongs.
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation espeak-ng -qq
          # reportlab: real PDF export for the script review checkpoint,
          # per explicit user request that a wall of chunked Telegram
          # text is unreadable -- the script now goes out as a proper
          # PDF attachment instead.
          pip install requests pillow edge-tts reportlab -q
          # Kokoro (local TTS, genuinely natural-sounding, no rate limit) —
          # CPU-only torch wheel keeps this from downloading unnecessary
          # CUDA packages, which matters since GitHub Actions runners have
          # no GPU anyway. espeak-ng is already installed above (a Kokoro
          # dependency for phonemization).
          pip install --index-url https://download.pytorch.org/whl/cpu torch -q
          pip install kokoro soundfile -q
          # Subtitle backup 2: transcription that runs HERE, so a hosted
          # Whisper outage cannot cost the episode its synced captions again
          # (run 31156373254 got 502 three times and captioned by guesswork).
          # Optional on purpose -- caption_align.local_whisper_words() returns
          # None when the package is missing and the chain moves to the
          # script-alignment backup, so a failed install must not fail the job.
          pip install faster-whisper -q || echo "faster-whisper unavailable; caption backup 3 still applies"
          # Narration backup 3: a neural voice that runs HERE.
          #
          # Counting only the routes that can actually clear the 8.5 audio
          # gate, narration had TWO -- Kokoro and edge-tts. gTTS and espeak
          # were listed as backups but their ceilings were 7.6 and 6.6, so
          # neither could ever ship an episode; both are now deleted from
          # every pipeline outright, and the gTTS package with them. Lose
          # Kokoro's weights and
          # Microsoft's endpoint on the same day and there was no episode.
          # Piper is neural, needs no key and no network at synthesis time,
          # and its voice model comes from GitHub releases rather than the
          # HuggingFace host Kokoro depends on -- so it fails independently
          # of the tier above it, which is the whole point of a backup.
          # Optional on purpose: piper_tts.synthesize() returns None when the
          # package is missing and the chain moves on, so a failed install
          # must not fail the job.
          pip install piper-tts onnxruntime -q || echo "piper unavailable; narration falls back to the tiers above"

      # PREFLIGHT: catch NameErrors before spending hours of compute.
      #
      # `chart_fn=generate_data_chart` -- a name defined in another
      # channel's module and never imported here -- silently disabled Ch1's
      # entire CHART visual register for four production runs, because the
      # NameError was swallowed by a try/except and the degraded fallback
      # logged as a success. The same class of bug (`episode_hook`) was
      # sitting unfired in Ch2's description-rebuild branch. pyflakes finds
      # both in under a second. Nothing here had ever been linted.
      #
      # This step SAVES Actions minutes: it fails in ~20s instead of after
      # a multi-hour run that produces a quietly broken episode.
      - name: Preflight — undefined names
        run: |
          pip install pyflakes -q
          OUT=$(python -m pyflakes channels/*/*.py video_pipeline/*.py 2>&1 \
                | grep "undefined name" || true)
          if [ -n "$OUT" ]; then
            echo "::error::undefined names found — this would crash or silently degrade at runtime"
            echo "$OUT"
            exit 1
          fi
          echo "no undefined names"

      # Every renderer, driven through 25 structurally different case shapes,
      # with the invariants checked on the PIXELS. This exists because "it
      # rendered without raising" has never been the same thing as "it
      # rendered correctly" on this channel: the CHART register produced a
      # fallback card on 29% of a shipped episode, a two-point bar chart drew
      # half of itself outside the frame, and a fourteen-event timeline
      # stopped at day six with the diagnosis off screen. All three logged as
      # success. ~70s, no network, no API spend.
      # Six defect CLASSES have each cost a full run to discover: an
      # acceptance threshold above the best score a correct answer can reach,
      # a retry with no source of variation, an import that never resolved, an
      # exit that discarded finished work, format leakage into viewer-facing
      # text, and a rewrite reporting success without checking it changed
      # anything. Finding instance number seven by burning four hours of a
      # live job is the waste this step exists to end. It fails only on leads
      # that are NOT in the triaged baseline, so it stays quiet until
      # something genuinely new appears.
      - name: Preflight — known defect classes
        run: python tools/defect_classes.py --check

      # THE BIGGEST PREFLIGHT SUITE WAS NEVER ACTUALLY RUN BY THIS WORKFLOW.
      #
      # FIX (found while watching run 31397175263): the three gates around
      # this one — pyflakes, defect classes, the fuzzer — have always run on
      # the runner. tools/preflight_ch1_thumbnails.py, which by now carries
      # 232 assertions including every regression found live in this
      # channel, ran only when a human remembered to type it. So each of
      # those checks was written to make a defect "impossible to ship again"
      # and then never stood between a defect and a run. Two failures the
      # suite already covers reached production anyway: the thumbnail gate
      # nothing could clear, and the unbound name on the resume path.
      #
      # Measured at 107s, needs no secrets and no network — it passes in a
      # bare checkout — so there is no reason it was not a gate except that
      # nobody wired it up. It blocks, like the other three.
      - name: Preflight — Ch1 assertions
        env:
          PYTHONPATH: ${{ github.workspace }}/channels:${{ github.workspace }}/video_pipeline
        run: |
          python tools/preflight_ch1_thumbnails.py || {
            echo "::error::a Ch1 preflight assertion failed — see NOT READY above"
            exit 1
          }

      - name: Preflight — fuzz the case shape
        run: |
          python tools/fuzz_case_shapes.py --render-dir "${RUNNER_TEMP}/fuzz" || {
            echo "::error::a renderer breaks on a real case shape — see the failures above"
            exit 1
          }

      # ── RULE 3: THE HEALTH CHECK DECIDES WHETHER THE DAY RUNS ──────────
      #
      # tools/provider_audit.py already knew how to answer "are there enough
      # working providers to make an episode", and already exited non-zero
      # when there were not. Nothing ever asked it. It ran only in a separate
      # job gated behind probe_only == 'providers', so a normal generate went
      # straight to work and discovered the answer the expensive way: run
      # 31888423963 spent 117 minutes proving every provider was down, then
      # reported it as a script-quality failure.
      #
      # Ten small probes cost about a minute. Finding out after five hours of
      # generation costs the episode, the review window, and a day's
      # allowance. So the probe runs first, and it is allowed to stop the day.
      #
      # RULE 7 is applied inside the audit: providers running on one-off
      # credits are NOT counted towards the minimum, because a chain propped
      # up by a finite grant is one that stops without warning.
      - name: Preflight — enough AI providers to run at all
        env:
          PYTHONUNBUFFERED: 1
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          KILOCODE_API_KEY: ${{ secrets.KILOCODE_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tools/provider_audit.py || {
            echo "::error::Not enough usable AI providers to generate an episode."
            echo "::error::Stopping now rather than spending hours discovering this."
            echo "::error::The audit output above names which are down and why."
            exit 1
          }

      - name: Pull latest state
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          # FIX (found live this session, run 30274723439 — real crash
          # AFTER the fetch-depth fix above): this and the final commit
          # step's `git push origin main` were both hardcoded to "main",
          # so a manual workflow_dispatch run on a feature branch (this
          # branch is checked out, not main) failed the final push with
          # "src refspec main does not match any" -- 5 retries, all
          # failed, the generated video/state never reached GitHub even
          # though generation itself succeeded. GITHUB_REF_NAME is the
          # actual checked-out branch (main on schedule, the given ref
          # on workflow_dispatch), so this now targets whatever branch
          # genuinely triggered the run instead of a hardcoded guess.
          # --autostash: the retry could never work without it. The pull ran
          # with the pipeline's own uncommitted output still in the tree, so
          # git refused ("cannot pull with rebase: You have unstaged
          # changes") on all five attempts and the commit never reached
          # GitHub -- the exact failure this retry loop exists to prevent.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true

      - name: Generate video (no upload)
        env:
          # FIX (direct user report, July 24 2026): job-level GITHUB_TOKEN,
          # scoped to "models: read" above — powers call_github_models()'s
          # free AI-provider fallback, no separate secret needed.
          GITHUB_TOKEN:          ${{ github.token }}
          # FIX (direct user report, July 24 2026 — "add everything that
          # is free and doesn't have any hidden billings"): two more
          # confirmed no-credit-card-required free providers. Both are
          # optional — call_cloudflare()/call_nvidia_nim() just skip
          # themselves (log a line, return None) if these secrets aren't
          # set yet, same as every other optional provider here. Add
          # real values in repo Settings -> Secrets -> Actions once
          # you've signed up (2 minutes each, no card):
          #   Cloudflare: dash.cloudflare.com -> My Profile -> API
          #     Tokens -> create with "Workers AI: Edit" permission
          #     (CLOUDFLARE_API_TOKEN); account ID from any zone's
          #     Overview page (CLOUDFLARE_ACCOUNT_ID)
          #   NVIDIA: build.nvidia.com -> sign in -> any model page ->
          #     "Get API Key" (NVIDIA_API_KEY)
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_API_KEY:        ${{ secrets.NVIDIA_API_KEY }}
          CEREBRAS_API_KEY:      ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY:     ${{ secrets.SAMBANOVA_API_KEY }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2:      ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY:    ${{ secrets.OPENROUTER_API_KEY }}
          COHERE_API_KEY:        ${{ secrets.COHERE_API_KEY }}
          MISTRAL_API_KEY:       ${{ secrets.MISTRAL_API_KEY }}
          # ── The five additions ───────────────────────────────────────
          # All permanent free tiers, none needs a credit card. Every one
          # is OPTIONAL: an unset secret is an empty string, the provider
          # skips itself silently, and the chain behaves exactly as it did
          # before it was added. Nothing here can break a working run.
          #   Kilo Code    kilocode.ai -> sign in -> API Keys
          #                (~200 requests an HOUR — the largest here)
          #   Hugging Face huggingface.co -> Settings -> Access Tokens
          #                (100,000 credits a month)
          #   LLM7         token.llm7.io — no account needed at all;
          #                works unauthenticated, a free token raises the
          #                rate from 30 to 120 requests a minute
          #   ModelScope   modelscope.cn -> Access Tokens (2,000 requests
          #                a day; needs the free Alibaba ID check done)
          #   SiliconFlow  siliconflow.cn -> API Keys (30 a minute)
          KILOCODE_API_KEY:      ${{ secrets.KILOCODE_API_KEY }}
          HUGGINGFACE_API_KEY:   ${{ secrets.HUGGINGFACE_API_KEY }}
          LLM7_API_KEY:          ${{ secrets.LLM7_API_KEY }}
          MODELSCOPE_API_KEY:    ${{ secrets.MODELSCOPE_API_KEY }}
          SILICONFLOW_API_KEY:   ${{ secrets.SILICONFLOW_API_KEY }}
          PIXABAY_KEY:           ${{ secrets.PIXABAY_KEY }}
          PEXELS_API_KEY:        ${{ secrets.PEXELS_API_KEY }}
          # FIX (found on full workflow audit, matching the same fix
          # already present in Ch3/Ch4's workflows): NEWS_API_KEY is used
          # by shorts_reels_engine.py's real trend-research feature (the
          # 2 daily trending Shorts) — was missing here entirely.
          NEWS_API_KEY:          ${{ secrets.NEWS_API_KEY }}
          ELEVENLABS_API_KEY:    ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
          FISH_AUDIO_API_KEY:    ${{ secrets.FISH_AUDIO_API_KEY }}  # optional TTS backup — leave secret empty/unset if not using it
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          # For Shorts' post-upload revenue snapshot (post_upload_reporter.py) —
          # Shorts upload during the generate phase, not the upload phase.
          GUMROAD_ACCESS_TOKEN:  ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          # Dedicated Gmail account for review-gate email fallback (a
          # separate account, not the per-channel branded emails) —
          # was genuinely missing before, meaning the email fallback
          # could never actually fire despite the code reading it correctly.
          GMAIL_SENDER_EMAIL:    ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD:    ${{ secrets.GMAIL_APP_PASSWORD }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PIPELINE_PHASE:        "generate"
          IS_MAKEUP:             ${{ github.event.inputs.is_makeup || 'false' }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/channels:$(pwd)/video_pipeline"
          python -u channels/betrayal_deepdive/clinical_pipeline.py

      # ── FIX: persist the rendered video/audio/thumbnail across runners ──
      # GitHub Actions machines are destroyed after each job. /tmp never
      # survives to the Upload workflow. This step ships the actual files
      # out as a build artifact so Upload can pull them back down later.
      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ch1-pending-video
          # FIX (real production failure, run 30082874147): this used to be
          # /tmp/deepdive/* -- the ENTIRE work directory, including every
          # raw/scaled stock-footage clip fetched for stage-matched video
          # assembly. The first run that ever got far enough to actually
          # populate that directory produced a 4.65GB artifact -- and
          # dawidd6/action-download-artifact's Node.js download step has a
          # hard ~4GiB buffer limit, so the upload phase crashed with
          # "The value of length is out of range" before it could even look
          # at pending_upload.json. Confirmed by reading both phases: the
          # upload phase only ever reads pending["video_path"] (final*.mp4)
          # and pending["thumbnail_path"] (thumbnail.jpg, written by the
          # shared thumbnail_engine_v2) -- audio files and Shorts clips are
          # never read back (Shorts are already uploaded during THIS
          # generate phase; only their URLs are reused for reporting).
          path: |
            /tmp/deepdive/final*.mp4
            /tmp/deepdive/thumbnail*
          retention-days: 2
          if-no-files-found: warn

      - name: Commit generated artifacts + state
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          # FIX: one git add per file. Previously all paths were in a single
          # git add command — if ANY one file didn't exist (e.g. next_week_strategy.json
          # only gets created on certain episodes), git aborted the WHOLE add as fatal,
          # silently swallowed by the old "|| true", and NOTHING got staged — not even
          # files that did exist. This is why pushes looked successful but saved nothing.
          git add channels/betrayal_deepdive/state.json || true
          git add channels/betrayal_deepdive/pending_upload.json || true
          git add channels/betrayal_deepdive/next_week_strategy.json || true
          # FIX: without this, the avatar cache is pointless — GitHub Actions
          # runners are fully ephemeral, so any cached avatar image not
          # committed here is silently lost the moment this runner finishes,
          # meaning every episode would regenerate a fresh image from
          # scratch anyway, defeating the entire purpose of caching it.
          git add channels/betrayal_deepdive/avatar_cache/ || true
          git add channels/betrayal_deepdive/fingerprint_history.json || true
          # FIX: topic_database.json gets written here too (add_topic_candidate
          # scores fresh candidates during generate) — without committing it,
          # every scored candidate is lost on this ephemeral runner.
          git add channels/betrayal_deepdive/topic_database.json || true
          # FIX: thumb_format_history.json / shorts_format_history.json
          # (real, appended-to learning history for the 11-format
          # thumbnail library and Shorts format-variety rotation) were
          # never explicitly added — same "ephemeral runner, nothing
          # persists unless committed" bug already fixed for every other
          # state file above.
          git add channels/betrayal_deepdive/thumb_format_history.json || true
          git add channels/betrayal_deepdive/shorts_format_history.json || true
          # FIX (direct user request, July 25 2026 — real resume-from-last-
          # passed-stage): without committing these, ckpt_save() in
          # clinical_pipeline.py writes to a checkout that's destroyed the
          # moment this runner finishes -- a resumed run (is_makeup=true)
          # would find nothing to resume from. if: always() on this whole
          # step (see above) means these are committed even when the
          # Generate step above was cancelled or failed partway through,
          # which is exactly the case this exists for.
          # THE PHOTO LIBRARY HAS TO SURVIVE THE RUNNER OR IT NEVER GROWS.
          #
          # stock_library.harvest() was written to "compound over weeks" and
          # never could: the library lives in the repo, this step never added
          # it, and GitHub runners are ephemeral — so every photograph fetched
          # was deleted minutes later. It sat at the 18 images that were once
          # committed by hand, while a single episode needs 37 photo cards.
          # That is why a 114-segment video showed 5 distinct photographs.
          git add video_pipeline/stock_library/ || true
          git add channels/betrayal_deepdive/checkpoint.json || true
          git add channels/betrayal_deepdive/checkpoint_audio.mp3 || true
          git diff --staged --quiet || git commit -m "chore: ch1 generated [skip ci]"
          # FIX: retry push instead of silently dropping it on conflict.
          # "|| true" alone meant a failed push (e.g. two workflows landing
          # near the same time) was swallowed with zero indication — the
          # commit would exist locally on that dead runner and nowhere else.
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed (attempt $i) — pulling + retrying in $((i*5))s"
            sleep $((i*5))
            # --autostash: the retry could never work without it. The pull ran
          # with the pipeline's own uncommitted output still in the tree, so
          # git refused ("cannot pull with rebase: You have unstaged
          # changes") on all five attempts and the commit never reached
          # GitHub -- the exact failure this retry loop exists to prevent.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
            if [ "$i" = "5" ]; then
              echo "::error::Push failed after 5 attempts — commit did NOT reach GitHub"
              exit 1
            fi
          done
